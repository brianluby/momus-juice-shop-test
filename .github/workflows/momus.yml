# End-to-end example of the released momus action on a large PR: the PR adds
# all of OWASP Juice Shop (1618a611b) to this otherwise empty repository.
# Pinned to a released tag of the reusable workflow; re-pin by changing the
# ref below.
name: momus

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork pull requests get no secrets: skip them instead of starting a runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: brianluby/momus-review/.github/workflows/review.yml@v0.1.3
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    with:
      # The same vendored-asset excludes as the README benchmark.
      exclude: |
        frontend/src/assets/**
        data/static/codefixes/**
        data/static/contractABIs.ts
